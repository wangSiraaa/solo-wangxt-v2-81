services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reservoir
      POSTGRES_PASSWORD: reservoir
      POSTGRES_DB: reservoir_teaching
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservoir"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://reservoir:reservoir@db:5432/reservoir_teaching
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
