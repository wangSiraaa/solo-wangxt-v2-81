services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reservoir
      POSTGRES_PASSWORD: reservoir
      POSTGRES_DB: reservoir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservoir"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://reservoir:reservoir@db:5432/reservoir
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
